apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: trading-bot-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      name: account-service
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: luigisr03/accounts-service:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgresql:5432/accounts
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_SECRET
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_KEY
            - name: ALPACA_PAPER_TRADING_BASE_URL
              value: http://alpaca-broker.alpaca-mock.svc.cluster.local:8080
              
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: trading-bot-testing
spec:
  type: LoadBalancer
  selector:
    app: account-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
