spring.application.name=account-service
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/accounts}
spring.datasource.username=${DATABASE_USERNAME:luigi}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# One paper-trading account is configured for the whole installation. Inject
# both values through deployment secrets; never commit them.
alpaca.api.key=${ALPACA_API_KEY:a}
alpaca.api.secret=${ALPACA_API_SECRET:a}
alpaca.api.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:http://localhost:8081}
alpaca.reconciliation-interval=${ACCOUNT_RECONCILIATION_INTERVAL:PT5M}
order-execution-persister.internal.base-url=${ORDER_EXECUTION_PERSISTER_INTERNAL_BASE_URL:}
