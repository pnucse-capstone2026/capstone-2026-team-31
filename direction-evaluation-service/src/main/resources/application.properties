spring.application.name=direction-evaluation-service
logging.structured.format.console=logstash
logging.structured.json.add.service=direction-evaluation-service
spring.datasource.url=${MEASUREMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/direction_evaluation_measurement}
spring.datasource.username=${MEASUREMENT_DATABASE_USERNAME:luigi}
spring.datasource.password=${MEASUREMENT_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=direction_eval
spring.flyway.schemas=direction_eval
spring.flyway.default-schema=direction_eval
spring.flyway.create-schemas=true
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:trading-bot-dev}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:trading-bot-vhost}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
measurement.direction-evaluation.horizon=${MEASUREMENT_DIRECTION_EVALUATION_HORIZON:PT1H}
measurement.rabbitmq.predictions-queue=${MEASUREMENT_PREDICTIONS_QUEUE:measurement.predictions}
measurement.rabbitmq.market-ticks-queue=${MEASUREMENT_MARKET_TICKS_QUEUE:measurement.market-ticks}
