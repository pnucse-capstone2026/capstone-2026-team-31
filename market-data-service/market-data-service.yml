apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  namespace: trading-bot-testing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      name: market-data-service
      labels:
        app: market-data-service
    spec:
      containers:
        - name: market-data-service
          image: luigisr03/market-data-service:1.0.2
          imagePullPolicy: Always
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: "trading-bot-vhost"
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: SPRING_RABBITMQ_PASSWORD
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_SECRET
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_KEY
            - name: ALPACA_API_MARKET_STREAM_URL
              value: wss://stream.data.alpaca.markets/v2/iex
