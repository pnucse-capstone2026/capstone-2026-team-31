apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-ingestion-service
  namespace: trading-bot-testing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: news-ingestion-service
  template:
    metadata:
      name: news-ingestion-service
      labels:
        app: news-ingestion-service
    spec:
      containers:
        - name: news-ingestion-service
          image: luigisr03/news-ingestion-service:1.0.2
          imagePullPolicy: Always
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: "trading-bot-vhost"
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: SPRING_RABBITMQ_PASSWORD
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_SECRET
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_KEY
            - name: ALPACA_API_NEWS_STREAM_URL
              value: "wss://stream.data.alpaca.markets/v1beta1/news"
---
apiVersion: v1
kind: Secret
metadata:
  name: news-ingestion-service-secret
  namespace: trading-bot-testing
type: Opaque
stringData:
  SPRING_RABBITMQ_PASSWORD: "1234"
  ALPACA_API_SECRET: 9DSiroEiyjPgf7pwuY9apT9wRz7YKiAZBwDMjx2bRgCZ
