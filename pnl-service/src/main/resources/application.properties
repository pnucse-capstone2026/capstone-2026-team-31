spring.application.name=pnl-service
logging.structured.format.console=logstash
logging.structured.json.add.service=pnl-service
spring.datasource.url=${MEASUREMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/pnl_measurement}
spring.datasource.username=${MEASUREMENT_DATABASE_USERNAME:luigi}
spring.datasource.password=${MEASUREMENT_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=pnl
spring.flyway.schemas=pnl
spring.flyway.default-schema=pnl
spring.flyway.create-schemas=true
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:trading-bot-dev}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:trading-bot-vhost}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
measurement.pnl.account-id=${MEASUREMENT_PNL_ACCOUNT_ID:paper-account}
measurement.pnl.starting-balance=${MEASUREMENT_PNL_STARTING_BALANCE:100000.00}
measurement.rabbitmq.executions-queue=${MEASUREMENT_EXECUTIONS_QUEUE:measurement.executions}
measurement.rabbitmq.market-ticks-queue=${MEASUREMENT_MARKET_TICKS_QUEUE:measurement.market-ticks}
