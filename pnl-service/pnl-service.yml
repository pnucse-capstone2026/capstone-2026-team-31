apiVersion: apps/v1
kind: Deployment
metadata:
  name: pnl-service
  namespace: trading-bot-measurement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pnl-service
  template:
    metadata:
      labels:
        app: pnl-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pnl-service
          image: luigisr03/pnl-service:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: 500Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MEASUREMENT_DATABASE_URL
              value: jdbc:postgresql://postgresql.trading-bot-testing.svc.cluster.local:5432/pnl_measurement
            - name: MEASUREMENT_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: measurement-postgresql-credentials
                  key: POSTGRES_USER
            - name: MEASUREMENT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: measurement-postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq.trading-bot-testing.svc.cluster.local
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: measurement-rabbitmq-credentials
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: measurement-rabbitmq-credentials
                  key: password
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              valueFrom:
                secretKeyRef:
                  name: measurement-rabbitmq-credentials
                  key: vhost
---
apiVersion: v1
kind: Service
metadata:
  name: pnl-service
  namespace: trading-bot-measurement
spec:
  selector:
    app: pnl-service
  ports:
    - name: http
      port: 8080
      targetPort: http
