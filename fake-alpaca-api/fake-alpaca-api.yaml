apiVersion: v1
kind: Namespace
metadata:
  name: trading-bot-testing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-alpaca-api
  namespace: trading-bot-testing
  labels:
    app.kubernetes.io/name: fake-alpaca-api
    app.kubernetes.io/component: test-double
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-alpaca-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-alpaca-api
        app.kubernetes.io/component: test-double
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fake-alpaca-api
          image: luigisr03/fake-alpaca-api:business-logic-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FAKE_ALPACA_REQUIRE_AUTH
              value: "true"
            - name: FAKE_ALPACA_FILL_MODE
              value: immediate
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: fake-alpaca-api
  namespace: trading-bot-testing
  labels:
    app.kubernetes.io/name: fake-alpaca-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-alpaca-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
