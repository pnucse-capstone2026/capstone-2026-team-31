spring.application.name=order-execution-persister
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/orders}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# This service owns and migrates the order_projection schema.
spring.flyway.enabled=true

# RabbitMQ connection
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:trading-bot-dev}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:1234}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:trading-bot-dev-vhost}
rabbitmq.assets.order-events-persister-queue=${RABBITMQ_ASSETS_ORDER_EVENTS_PERSISTER_QUEUE:order-events-persister}

alpaca.api.paper-trading-base-url=${ALPACA_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}
alpaca.api.key=${ALPACA_API_KEY:a}
alpaca.api.secret=${ALPACA_API_SECRET:a}
order-reconciliation.interval=${ORDER_RECONCILIATION_INTERVAL:PT120M}
