apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-execution-persister
  namespace: trading-bot-testing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-execution-persister
  template:
    metadata:
      name: order-execution-persister
      labels:
        app: order-execution-persister
    spec:
      containers:
        - name: order-execution-persister
          image: luigisr03/order-execution-persister:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgresql:5432/orders
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: trading-bot-vhost
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: SPRING_RABBITMQ_PASSWORD
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_SECRET
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_KEY
            - name: ALPACA_PAPER_TRADING_BASE_URL
              value: http://alpaca-broker.alpaca-mock.svc.cluster.local:8080
---
apiVersion: v1
kind: Service
metadata:
  name: order-execution-persister
  namespace: trading-bot-testing
spec:
  selector:
    app: order-execution-persister
  ports:
    - name: http
      port: 8080
      targetPort: 8080
