spring.application.name=order-execution-service

# RabbitMQ connection
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:trading-bot-dev}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:1234}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:trading-bot-dev-vhost}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# RabbitMQ assets
rabbitmq.assets.orders-approved-queue=${RABBITMQ_ASSETS_ORDERS_APPROVED_QUEUE:orders.approved}
rabbitmq.assets.order-events-portfolio-queue=${RABBITMQ_ASSETS_ORDER_EVENTS_PORTFOLIO_QUEUE:order-events-portfolio}
rabbitmq.assets.order-events-notification-queue=${RABBITMQ_ASSETS_ORDER_EVENTS_NOTIFICATION_QUEUE:order-events-notification}
rabbitmq.assets.order-events-persister-queue=${RABBITMQ_ASSETS_ORDER_EVENTS_PERSISTER_QUEUE:order-events-persister}
rabbitmq.assets.order-events-exchange=${RABBITMQ_ASSETS_ORDER_EVENTS_EXCHANGE:order-events-fanout}
rabbitmq.assets.measurement-executions-exchange=${RABBITMQ_ASSETS_MEASUREMENT_EXECUTIONS_EXCHANGE:measurement-executions-exchange}
rabbitmq.assets.measurement-executions-routing-key=${RABBITMQ_ASSETS_MEASUREMENT_EXECUTIONS_ROUTING_KEY:measurement.executions}

#Alpaca API Config
alpaca.api.stream-url=${ALPACA_API_STREAM_URL:wss://paper-api.alpaca.markets/stream}
alpaca.api.subscription-message=${ALPACA_API_SUBSCRIPTION_MESSAGE:{"action": "listen", "data": {"streams": ["trade_updates"]}}}
alpaca.api.order-endpoint=${ALPACA_API_ORDER_ENDPOINT:https://paper-api.alpaca.markets/v2/orders}
alpaca.api.paper-trading-base-url=${ALPACA_API_PAPER_TRADING_BASE_URL:https://paper-api.alpaca.markets}
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
