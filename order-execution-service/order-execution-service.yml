apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-execution-service
  namespace: trading-bot-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-execution-service
  template:
    metadata:
      name: order-execution-service
      labels:
        app: order-execution-service
    spec:
      containers:
        - name: order-execution-service
          image: luigisr03/order-execution-service:1.0.0
          imagePullPolicy: Always
          env:
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_VIRTUAL_HOST
              value: "trading-bot-vhost"
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: SPRING_RABBITMQ_PASSWORD
            - name: ALPACA_API_ORDER_ENDPOINT
              value: http://alpaca-broker.alpaca-mock.svc.cluster.local:8080/v2/orders
            - name: ALPACA_API_STREAM_URL
              value: ws://alpaca-broker.alpaca-mock.svc.cluster.local:8080/stream
            - name: ALPACA_API_PAPER_TRADING_BASE_URL
              value: http://alpaca-broker.alpaca-mock.svc.cluster.local:8080
            - name: ALPACA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_SECRET
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-ingestion-service-secret
                  key: ALPACA_API_KEY
